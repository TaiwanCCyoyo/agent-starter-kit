description = "Manage Git worktrees while preserving project memory and context."

# {{args}} is the worktree action (create, finish, consolidate)
prompt = """
You are an expert at Git worktree lifecycle management. Please perform the requested worktree action.

### Action
{{args}}

### Mandatory Guidelines (from worktree-manager skill)
- **Soul Protocol**: Ensure memory is injected during creation and consolidated during teardown.
- **Layered Memory**: Copy or initialize the full taxonomy: `MEMORY.md`, Warm files, `changes/`, `archive/`, `runs/`, and `candidates/`.
- **Plan Lifecycle**: Keep branch-specific multi-step plans under `changes/<change-id>/` and consolidate/archive them before worktree removal.
- **Exploration**: Use the `repo-explorer` subagent to map out the repository structure if creating or merging complex worktrees.
- **Consolidation**: Use the `memory-auditor` subagent to identify critical lessons to backfill to the main branch memory.

### Execution Plan
1. Follow the protocols defined in the `worktree-manager` skill.
2. Use `git worktree` commands for physical management.
3. Use specialized subagents for analysis and memory synchronization.
4. Report consolidated items, target files, archived change folders, and skipped duplicates in Traditional Chinese.
"""
