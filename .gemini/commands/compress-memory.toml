description = "Reorganize and compress the project memory files to maintain high signal-to-noise ratio."

# {{args}} is optional additional instruction
prompt = """
You are an expert at information architecture. Please reorganize and compress the project's memory files (`.agents/memory/`).

### User Instruction
{{args}}

### Mandatory Guidelines (from memory-maintenance skill)
- **Consult Skill**: Use the `memory-maintenance` skill for "Progressive Disclosure" and "High-Signal vs. Noise" principles.
- **Threshold**: Only compress if the main `MEMORY.md` is too verbose (>2000 tokens) or contains redundant historical data.
- **Extraction**: Extract detailed technical documentation or logs into sub-files (e.g., ARCHIVE.md, TROUBLESHOOTING.md) and leave links in the main file.

### Execution Plan
1. Scan and analyze all files in `.agents/memory/`.
2. Identify redundant facts, resolved tasks, or overly detailed sections.
3. Condense historical data into single-sentence summaries.
4. If necessary, create/update auxiliary files and link them in `MEMORY.md`.
5. Report back with a summary of the changes in Traditional Chinese.
"""
