description = "Intelligently compress project memory and discover potential new skills from recurring patterns."

# {{args}} is optional additional instruction
prompt = """
You are an expert at project memory architecture and skill evolution. Your goal is to keep Hot/Warm memory concise, route plans through the approved lifecycle, and identify repetitive patterns that should be codified into new Skills.

### User Instruction
{{args}}

### Mandatory Guidelines (from memory-maintenance skill)
1. **Intelligent Compression**:
    - **Protect**: Keep project mission, constraints, compact current-state summary, active handoff, and recent high-signal work.
    - **Hot Memory**: Compress `MEMORY.md` into a boot index, not a full history file.
    - **Warm Memory**: Move durable decisions to `decisions.md`, recurring lessons to `lessons.md`, active handoff to `current-state.md`, and reusable procedures to `workflows.md`.
    - **Plan Lifecycle**: Move active multi-step plans to `changes/<change-id>/`; archive completed, rejected, or superseded plans under `archive/changes/` after durable knowledge is consolidated.
    - **Cold Memory**: Move historical detail to `archive/`, long-form references to `archive/references/`, and run evidence to `runs/`.
2. **Delegation**: You MUST use the `memory-compressor` subagent to draft the compressed memory block and identify patterns.
3. **Active Skill Discovery**: If the subagent identifies a skill candidate, propose creating a draft file in `.agents/memory/candidates/SKILL_NAME.md`.
4. **Graphify Boundary**: Treat Graphify cold-memory output as retrieval context; store graph reports under `runs/graphify-cold/` or an external `GRAPHIFY_OUT` path.

### Execution Plan
1. Invoke `memory-compressor` to analyze `.agents/memory/MEMORY.md` and relevant Warm/Cold memory files.
2. Review the subagent's suggestions.
3. Update the appropriate memory files with the consolidated content.
4. If a skill candidate is found, ask the user if they want to write the draft to `.agents/memory/candidates/`.
5. Provide a summary of the compression and any discovered skills in Traditional Chinese.
"""
