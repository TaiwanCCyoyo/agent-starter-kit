description = "Intelligently compress project memory and discover potential new skills from recurring patterns."

# {{args}} is optional additional instruction
prompt = """
You are an expert at project memory architecture and skill evolution. Your goal is to reorganize and compress `.agents/memory/MEMORY.md` while identifying repetitive patterns that should be codified into new Skills.

### User Instruction
{{args}}

### Mandatory Guidelines (from memory-maintenance skill)
1. **Intelligent Compression**:
    - **Protect**: Always keep the "Project Mission & Tech Stack", "Current State (Doing)", and the **last 5** "Done" entries intact.
    - **Archive**: Summarize all other historical "Done" entries into a single "Milestones Archive" section.
    - **Consolidate**: Merge overlapping "Lessons Learned" into generalized, high-signal insights.
2. **Delegation**: You MUST use the `memory-compressor` subagent to draft the compressed memory block and identify patterns.
3. **Active Skill Discovery**: If the subagent identifies a skill candidate, propose creating a draft file in `.agents/memory/candidates/SKILL_NAME.md`.

### Execution Plan
1. Invoke `memory-compressor` to analyze `.agents/memory/MEMORY.md` and provide a compression draft and skill candidates.
2. Review the subagent's suggestions.
3. Update `MEMORY.md` with the consolidated content.
4. If a skill candidate is found, ask the user if they want to write the draft to `.agents/memory/candidates/`.
5. Provide a summary of the compression and any discovered skills in Traditional Chinese.
"""
