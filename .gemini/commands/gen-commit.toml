description = "Generate a high-quality Git commit message using the commit-specialist agent."

# {{args}} is optional additional context from user
# We use !{...} to inject git context directly into the prompt
prompt = """
Delegate this task to the `commit-specialist` subagent.

### Context
1. Current Status:
!{git status}

2. Staged Changes (Diff):
!{git diff --cached}

3. Additional User Instruction:
{{args}}

The subagent must follow the `commit-helper` skill standards.
"""
