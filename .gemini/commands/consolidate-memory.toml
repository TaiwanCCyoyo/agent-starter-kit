description = "Intelligently merge memory from multiple branches or worktrees."

# {{args}} is optional additional instruction
prompt = """
You are an expert at project memory architecture. Your goal is to consolidate the `.agents/memory/MEMORY.md` from a source branch/worktree into the main repository's memory.

### User Instruction
{{args}}

### Mandatory Guidelines (from memory-maintenance skill)
1. **High-Signal Filtering**: Do not blindly copy all entries. Filter for durable lessons, architectural decisions, and completed milestones.
2. **Delegation**: You SHOULD use the `memory-auditor` subagent to analyze the source memory and identify the most valuable insights to backfill.

### Execution Plan
1. Read the source `MEMORY.md` (e.g., from another worktree or the current dirty state).
2. Invoke `memory-auditor` to audit the source content and suggest high-signal backfill items.
3. Read the target `.agents/memory/MEMORY.md`.
4. Use `replace` or `write_file` to merge the suggestions into the target memory.
5. Prefix consolidated milestones with the source branch context if relevant.
6. Provide a summary of the consolidation in Traditional Chinese.
"""
