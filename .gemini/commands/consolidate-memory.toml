description = "Intelligently merge memory from multiple branches or worktrees."

# {{args}} is optional additional instruction
prompt = """
You are an expert at project memory architecture. Your goal is to consolidate layered `.agents/memory/` content from a source branch/worktree into the main repository's memory.

### User Instruction
{{args}}

### Mandatory Guidelines (from memory-maintenance skill)
1. **High-Signal Filtering**: Do not blindly copy all entries. Filter for durable lessons, architectural decisions, active handoff, completed milestones, and still-relevant change plans.
2. **Delegation**: You SHOULD use the `memory-auditor` subagent to analyze the source memory and identify the most valuable insights to backfill.
3. **Layered Routing**: Route consolidated items to the correct destination file instead of forcing everything into `MEMORY.md`.
4. **Plan Lifecycle**: Move completed, rejected, or superseded source change plans to `archive/changes/` after consolidation.

### Execution Plan
1. Read the source memory directory, starting with `MEMORY.md` and relevant Warm files.
2. Invoke `memory-auditor` to audit the source content and suggest high-signal backfill items.
3. Read the target `.agents/memory/MEMORY.md` and relevant Warm files.
4. Use `replace` or `write_file` to merge the suggestions into the correct target files.
5. Prefix consolidated milestones with the source branch context if relevant.
6. Report consolidated target files, archived change folders, and skipped duplicates in Traditional Chinese.
"""
