description = "Persist project-specific facts, decisions, lessons, plans, and handoff notes into the layered local memory."

# {{args}} is the fact or information to be saved
prompt = """
You are an expert at project memory maintenance. Please persist the following information into the project's layered local memory under `.agents/memory/`.

### Context to Save
{{args}}

### Mandatory Guidelines (from memory-maintenance skill)
- **Consult Skill**: Use the `memory-maintenance` skill for all quality standards (High-Signal, Concise, Table formatting).
- **Project Scope**: Ensure this information is specific to **this project**.
- **Soul Protocol**: Follow the "3-Phase Ritual" (Read, Route, Report).
- **Layered Routing**:
  - Hot boot/current summary -> `.agents/memory/MEMORY.md`.
  - Durable decisions -> `.agents/memory/decisions.md`.
  - Concise recurring lessons -> `.agents/memory/lessons.md`.
  - Active handoff detail -> `.agents/memory/current-state.md`.
  - Active change plans -> `.agents/memory/changes/<change-id>/proposal.md`, with optional `design.md`, `tasks.md`, and `specs/`.
  - Completed/rejected/superseded change plans -> `.agents/memory/archive/changes/YYYY-MM-DD-<change-id>/`.
  - Run evidence -> `.agents/memory/runs/`.
  - References -> `.agents/memory/archive/references/`.
  - Evolution drafts -> `.agents/memory/candidates/`.
- **Retrieval Boundary**: Treat Graphify/RAG/search output as context until curated; Graphify output must not overwrite Hot/Warm memory automatically.
- **No Top-Level Plan Noise**: Do not create top-level `*_PLAN.md`, `PROPOSAL_*.md`, or `SESSION_LOG.md`.
- **Delegation**: When updating memory after complex changes, you SHOULD use the `memory-auditor` subagent to analyze diffs and identify durable lessons/decisions.

### Execution Plan
1. (Optional) Invoke `memory-auditor` to audit recent changes and suggest memory updates.
2. Read `.agents/memory/MEMORY.md` and any Warm file matching the update type.
3. Identify the correct memory layer and target file.
4. Use `replace` or `write_file` to apply the new fact or the auditor's suggestions.
5. Provide a brief Traditional Chinese summary of what was saved and where.
"""
