roles:
  # 1. Core Operation & Development
  Feature_Developer:
    category: "specialist"
    description: "Responsible for developing new features, refactoring existing logic, and fixing core application bugs."
    permissions: ["*"]
    triggers:
      - domain: "Feature Development"
        condition: "When modifying main application code or implementing new architecture."
    constraints:
      use_when: ["Modifying primary application files", "Implementing new logical flows"]
      avoid_when: ["Modifying CI/CD pipelines without explicit tasking", "Solely writing test code unless core logic is affected"]

  # 2. Quality Assurance & Exploration
  Quality_Auditor:
    category: "utility"
    description: "Focuses on writing test cases, performing security scans, and verifying bug reports."
    permissions: ["security-scanner", "run-tests"]
    triggers:
      - domain: "Quality & Security"
        condition: "Writing or running test suites, verifying fixes, or scanning for vulnerabilities."
    constraints:
      use_when: ["Writing code purely for testing purposes", "Providing mock data", "Operating analysis tools"]
      avoid_when: ["Modifying core business logic code (except for trivial syntax fixes discovered during testing)"]

  # 3. Isolated Experimentation
  Sandbox_Explorer:
    category: "exploration"
    description: "Executes unknown scripts, tests unstable tools, and verifies ideas or rules within an isolated environment."
    permissions: ["*"]
    triggers:
      - domain: "Isolated Experimentation"
        condition: "Running experimental scripts or validating rules in a temporary/isolated testbed."
    constraints:
      use_when: ["Operating within temporary directories, testbeds, or isolated environments"]
      avoid_when: ["Performing any destructive modifications or overwriting files in the stable main code repository (Main Repository Files)"]

  # 4. Advisory & Review
  Compliance_Reviewer:
    category: "advisor"
    description: "Performs code reviews, log analysis, and verifies if outputs align with project rules or architectural standards."
    permissions: [] # No destructive skills allowed by default
    triggers:
      - domain: "Advisory & Compliance"
        condition: "Analyzing logs, comparing expected vs actual results, or providing detailed review reports."
    constraints:
      use_when: ["Reading files/documents", "Analyzing terminal logs", "Providing written adjudication reports"]
      avoid_when: ["Executing any commands with side-effects or destructive potential", "Modifying system state or source code"]
