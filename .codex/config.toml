[features]
codex_hooks = true

[agents]
max_threads = 4
max_depth = 1

[mcp_servers.memory-control]
command = "uv"
args = ["run", "python", ".codex/mcp/memory_control.py"]
cwd = ".."
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled_tools = ["dismiss_reminder"]
default_tools_approval_mode = "prompt"

[mcp_servers.memory-control.tools.dismiss_reminder]
approval_mode = "auto"

[mcp_servers.memory-db]
command = "uvx"
args = ["mcp-server-sqlite", "--db-path", ".memories/memory_store.db"]
cwd = ".."
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled_tools = ["read_query", "write_query", "create_table", "list_tables", "describe_table"]
default_tools_approval_mode = "prompt"

[mcp_servers.memory-db.tools.read_query]
approval_mode = "auto"

[mcp_servers.memory-db.tools.list_tables]
approval_mode = "auto"

[mcp_servers.memory-db.tools.describe_table]
approval_mode = "auto"
