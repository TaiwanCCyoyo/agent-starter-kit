repos:
  # Basic out-of-the-box checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Detect Secrets (Replaces the legacy security-scanner skill)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: package\.lock\.json

  # Enforce encoding (UTF-8) and language constraints for the entire project
  - repo: local
    hooks:
      - id: file-validation
        name: File Hygiene (Encoding, English & Cleanup)
        entry: uv run python scripts/file_hygiene.py --file
        language: system
        types: [text]
        exclude: ^(uv\.lock|.*\.json)$  # Optional: exclude specific auto-generated files if needed

  # Ruff (Python Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
