repos:
  # Basic out-of-the-box checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Detect Secrets (Replaces the legacy security-scanner skill)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: package\.lock\.json

  # Enforce English content for core documentation and agent logic
  - repo: local
    hooks:
      - id: enforce-english
        name: Enforce English Content
        entry: python scripts/check_english.py
        language: system
        files: ^(README\.md|\.gemini\/GEMINI\.md|.*\/skills\/.*|.*\/workflows\/.*|.*\/rules\/.*)$

  # Ruff (Python Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
